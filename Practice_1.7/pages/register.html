<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuinoWeb - Registration</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap");</style>
</head>
<body>
<div class="login">
    <form id="registrationForm" action="register.php" method="POST" class="login__form">
        <h1 class="login__title">Registration Form</h1>
        <div class="login__content">
            <div class="login__box">
                <i class="bx bx-user"></i>
                <div class="login__box-input">
                    <input class="login__input" type="text" id="username" name="username" required>
                    <label class="login__label" for="username">Username</label>
                </div>
            </div>
            <div class="login__box">
                <i class="ri-lock-2-line login__icon"></i>
                <div class="login__box-input">
                    <input type="password" id="password" name="password" required class="login__input">
                    <label class="login__label" for="password">Password</label>
                    <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                </div>
            </div>
            <div class="login__box">
                <i class="bx bx-envelope"></i>
                <div class="login__box-input">
                    <input type="email" id="email" name="email" required class="login__input">
                    <label class="login__label" for="email">Email</label>
                </div>
            </div>
            <div class="login__box">
                <i class="bx bx-phone"></i>
                <div class="login__box-input">
                    <input type="tel" id="contact" name="contact" required class="login__input">
                    <label class="login__label" for="contact">Contact Number</label>
                </div>
            </div>
        </div>
        <button type="submit" class="login__button">Sign Up</button>
        <p class="login__register">
           Already have an account? <a href="index.html"><b>Login now</b></a>
        </p>
        <p class="or">
            ----------------- OR -----------------
        </p>
        <div class="icons">
           <a href="https://www.google.com"><i class="bx bxl-google"></i></a>
           <a href="https://www.facebook.com"><i class="bx bxl-facebook"></i></a>
        </div>
    </form>
</div>
<script src="../scripts/script.js"></script>
</body>
</html>
